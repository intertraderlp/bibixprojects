<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Bibix IG — Campaigns</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #333;
      min-width: 780px;
      padding: 24px;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }

    h2 { font-size: 20px; }

    .header-actions { display: flex; gap: 10px; }

    button {
      padding: 8px 16px;
      font-size: 13px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .btn-export { background: #3897f0; color: white; }
    .btn-clear  { background: #e63946; color: white; }
    button:hover { opacity: 0.87; }

    /* ── Filters ── */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: flex-end;
    }

    .filter-group { display: flex; flex-direction: column; gap: 4px; }
    .filter-group label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.4px; font-weight: bold; }

    .filters select,
    .filters input {
      padding: 7px 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 13px;
      background: white;
      height: 34px;
    }

    .filters input[type="date"] { width: 148px; }

    .btn-reset {
      background: #f0f0f0;
      color: #555;
      font-weight: normal;
      height: 34px;
      padding: 0 14px;
      font-size: 12px;
      align-self: flex-end;
    }

    /* ── Summary bar ── */
    #countBar {
      font-size: 13px;
      color: #888;
      margin-bottom: 14px;
    }

    /* ── Campaign cards ── */
    .campaign-card {
      background: white;
      border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 14px;
      overflow: hidden;
    }

    /* Card header */
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 18px;
      border-bottom: 1px solid #f0f0f0;
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-header-left  { display: flex; align-items: center; gap: 10px; }
    .card-header-right { display: flex; align-items: center; gap: 12px; }

    .type-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      color: white;
    }

    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: bold;
    }
    .status-done    { background: #e8f8ed; color: #27ae60; }
    .status-stopped { background: #fff3cd; color: #e67e22; }
    .status-running { background: #e3f0fb; color: #3897f0; }

    .completion {
      font-size: 13px;
      font-weight: bold;
      color: #444;
    }

    .card-date { font-size: 12px; color: #aaa; }

    /* Card body */
    .card-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    @media (max-width: 780px) {
      .card-body { grid-template-columns: 1fr; }
    }

    .card-section {
      padding: 14px 18px;
      border-right: 1px solid #f5f5f5;
    }
    .card-section:last-child { border-right: none; }

    .section-title {
      font-size: 10px;
      font-weight: bold;
      color: #bbb;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 8px;
    }

    .info-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 5px;
      font-size: 13px;
    }

    .info-label {
      font-size: 11px;
      color: #aaa;
      min-width: 90px;
      flex-shrink: 0;
    }

    .info-value { color: #333; font-weight: 500; }
    .info-value a { color: #3897f0; text-decoration: none; }
    .info-value a:hover { text-decoration: underline; }

    /* Stats grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .stat-box {
      background: #f8f8f8;
      border-radius: 7px;
      padding: 8px 10px;
      text-align: center;
    }

    .stat-value { font-size: 16px; font-weight: bold; color: #3897f0; }
    .stat-label { font-size: 10px; color: #aaa; margin-top: 2px; }

    /* Progress bar */
    .progress-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .progress-track {
      flex: 1;
      height: 6px;
      background: #eee;
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      border-radius: 3px;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 80px;
      color: #bbb;
      font-size: 15px;
    }
  </style>
</head>
<body>

  <header>
    <h2>🚀 Campaigns</h2>
    <div class="header-actions">
      <button class="btn-export" id="exportBtn">Export CSV</button>
      <button class="btn-clear"  id="clearBtn">Clear All</button>
    </div>
  </header>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-group">
      <label>Type</label>
      <select id="filterType">
        <option value="">All types</option>
        <option value="like">❤️ Likes</option>
        <option value="comment_reply">💬 Replies</option>
        <option value="follow">👤 Follows</option>
        <option value="unfollow">👋 Unfollows</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Status</label>
      <select id="filterStatus">
        <option value="">All</option>
        <option value="done">✅ Done</option>
        <option value="stopped">⚠️ Stopped</option>
        <option value="running">🔄 Running</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Date From</label>
      <input type="date" id="filterDateFrom" />
    </div>
    <div class="filter-group">
      <label>Date To</label>
      <input type="date" id="filterDateTo" />
    </div>
    <div class="filter-group">
      <label>My Profile</label>
      <select id="filterProfile">
        <option value="">All profiles</option>
      </select>
    </div>
    <button class="btn-reset" id="resetBtn">✕ Reset</button>
  </div>

  <div id="countBar"></div>
  <div id="campaignList"><p class="empty">Loading…</p></div>

  <script src="campaigns.js"></script>
</body>
</html>
